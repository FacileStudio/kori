# example.kori.yml — every setting, every default, explicit.
# Written to ~/.kori.yml on first boot; identical to the settings.Template
# in internal/settings/scaffold.go. Delete ~/.kori.yml to regenerate it.
provider:
  backend: anthropic
  model: ""
  base_url: ""
  api_key: ""

session:
  root: .
  system_prompt: ""
  continue: false

limits:
  max_iterations: 5
  compact_at: 75000
  # grind budget: the per-run minimum spend a run must reach before stopping
  # counts as finished. Both floors at 0 turn it off; grind_continuations caps
  # how many continuation notices one run can be given. grind_continuations: 0
  # turns the budget off even when a floor is set.
  grind_min_cost: 0
  grind_min_tokens: 0
  grind_continuations: 2

tools:
  run_command: true
  web_fetch: true
  tasks: true
  parallel_agents: true
  diagnostics: true
  search_content: true
  find_files: true

security:
  approve_tools: false
  path_isolation: false
  # deny_elevation refuses sudo-style elevation in run_command: a policy guard
  # against accidents and injected instructions, not a security boundary.
  # OS-level enforcement is the real wall.
  deny_elevation: true
  env_isolation: false

reasoning:
  effort: ""
  thinking: true
  budget: 0

discovery:
  project_context: true
  skills: true
  trust_skills: false
  trust_hooks: false

ui:
  rendering_mode: inline
  group_tools: true
  show_thinking: true
  diffs: true
  prompt_placeholder: "Ask something. Esc stops a run, ctrl+c stops or quits, ctrl+\\ forces it."
  start_message: ""
  transparent_blocks: false
  cron_list_json: false
  show_hooks: true
  show_hook_output: true

editor:
  editor: ""             # empty uses the system EDITOR; set a path to force an editor (e.g. /usr/bin/vim)
  prompt_edit_key: ""    # names the input field the editor writes back to; empty means every message uses the full editor

sources:
  skill_dirs: []
  mcp_files: []
  mcp: {}

hooks: []
# Scheduled jobs no longer live in this file: one YAML file per job under
# ~/.kori/jobs/ (e.g. news.yml), trusted with `kori cron trust <name>`.
gates: []